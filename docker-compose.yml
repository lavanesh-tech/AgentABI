name: agentabi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentabi
      POSTGRES_PASSWORD: agentabi
      POSTGRES_DB: agentabi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentabi -d agentabi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/agentabi_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode (no separate Zookeeper needed). Official Apache
  # Kafka image — `bitnami/kafka:3.8` became unresolvable after
  # Broadcom's 2025 retention-policy change pulled free Bitnami tags
  # (see docs/DECISIONS.md ADR-076, supersedes ADR-001). Same KRaft
  # topology, same listener names/ports, same topics
  # (agentabi.analysis.requests/.results/.dlq — still relying on
  # Kafka's own auto-create-topics default, unchanged), same
  # application bootstrap config (KAFKA_BOOTSTRAP_SERVERS=kafka:9092).
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker local dev — the equivalent of Bitnami's implicit
      # defaults, made explicit so `apache/kafka`'s stricter startup
      # validation (it errors rather than silently defaulting when a
      # replication factor exceeds the broker count) doesn't reject a
      # 1-node cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # `apache/kafka`'s image doesn't put $KAFKA_HOME/bin on PATH the way
      # Bitnami's did — the bare `kafka-topics.sh` from the prior fix
      # resolved to "not found" (confirmed on real Mac Docker: exit 127).
      # The absolute path under $KAFKA_HOME still does a real broker
      # metadata request against the internal listener (not just a
      # process-exists check), so this stays a genuine liveness probe.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Phase 15: local trace sink. Disabled by default from the API/worker's
  # side (OTEL_ENABLED=false) — this service only matters once that's
  # turned on. No credentials, no cloud exporter (spec §27).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://agentabi:agentabi@postgres:5432/agentabi
      REDIS_DSN: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: agentabi-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # Phase 13's Kafka worker, containerized here for the first time so
  # Phase 16's Prometheus config has a real scrape target (spec §14). Not
  # in `api`'s image build — same image, different command — so it stays
  # in lockstep with the API's dependency set without a second Dockerfile.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.kafka.worker"]
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://agentabi:agentabi@postgres:5432/agentabi
      REDIS_DSN: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      OTEL_SERVICE_NAME: agentabi-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "9101:9101" # Prometheus metrics (spec §14) — no FastAPI in this process
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    # This service shares its image (and that image's Dockerfile-level
    # HEALTHCHECK, `curl http://localhost:8000/api/v1/health`) with `api`
    # — Compose only overrides `command:` above, not the image's baked-in
    # HEALTHCHECK, so without an explicit override here the worker
    # inherits a probe against a port nothing in this process listens on
    # (it runs the Kafka worker, not uvicorn) and Docker reports it
    # permanently unhealthy regardless of real liveness. Overridden here
    # to probe the worker's own real HTTP surface instead: the
    # Prometheus metrics server `start_worker_metrics_server` (spec §14)
    # already starts on port 9101 early in `app.kafka.worker.main()`, so
    # a successful response is genuine process liveness — not Kafka
    # connectivity/consumer-group health, which stays a separate concern
    # (Kafka's own healthcheck, the consumer's retry/DLQ handling).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  # Phase 16: scrapes api/worker `/metrics`. No remote_write, no
  # credentials, config lives entirely in observability/prometheus.yml.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  # Phase 16: auto-provisioned datasource + dashboard (spec §30) — no
  # manual clicking needed after `docker compose up`. Local-only
  # placeholder admin credentials (never real secrets — spec §32);
  # override GRAFANA_ADMIN_PASSWORD via .env for anything beyond a
  # laptop.
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-agentabi_local_only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Deliberately NOT /etc/grafana/provisioning/dashboards/files — that
      # path is nested inside the read-only mount directly above, and
      # Docker can't create a mountpoint inside an already-mounted
      # read-only filesystem ("read-only file system" on `docker compose
      # up`). A conventional, non-nested sibling path under /etc/grafana
      # instead — both mounts attach directly to the image's own
      # /etc/grafana directory, neither nested inside the other.
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # host 3001 — 3000 is already the frontend (`web`)
    depends_on:
      - prometheus

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AGENTABI_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  kafka_data:
  prometheus_data:
  grafana_data:
