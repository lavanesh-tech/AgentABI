name: Deploy AgentABI to AWS EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: agentabi-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "719429929317"
  EKS_CLUSTER: agentabi-dev-eks
  NAMESPACE: agentabi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::719429929317:role/agentabi-dev-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agentabi-api:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_AGENTABI_API_URL=/api/v1
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agentabi-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    environment: demo
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::719429929317:role/agentabi-dev-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Helm lint
        run: |
          helm lint deploy/helm/agentabi \
            --values deploy/helm/agentabi/values-aws-dev.yaml \
            --set image.registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
            --set image.tag="$IMAGE_TAG"

      - name: Deploy AgentABI
        run: |
          helm upgrade --install agentabi \
            deploy/helm/agentabi \
            --namespace "$NAMESPACE" \
            --values deploy/helm/agentabi/values-aws-dev.yaml \
            --set image.registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
            --set image.tag="$IMAGE_TAG" \
            --rollback-on-failure \
            --wait \
            --timeout 15m

  verify:
    name: Verify AWS Deployment
    runs-on: ubuntu-latest
    environment: demo
    needs: deploy

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::719429929317:role/agentabi-dev-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Verify deployments
        run: |
          kubectl rollout status \
            deployment/agentabi-api \
            -n "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status \
            deployment/agentabi-worker \
            -n "$NAMESPACE" \
            --timeout=300s

          kubectl rollout status \
            deployment/agentabi-frontend \
            -n "$NAMESPACE" \
            --timeout=300s

      - name: Verify stateful workloads
        run: |
          kubectl rollout status \
            statefulset/agentabi-kafka \
            -n "$NAMESPACE" \
            --timeout=600s

          kubectl rollout status \
            statefulset/agentabi-neo4j \
            -n "$NAMESPACE" \
            --timeout=600s

      - name: Verify API health and dependencies
        shell: bash
        run: |
          set -euo pipefail

          kubectl port-forward \
            -n "$NAMESPACE" \
            service/agentabi-api \
            18000:80 >/tmp/agentabi-port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          sleep 5

          HEALTH="$(curl -fsS http://127.0.0.1:18000/api/v1/health)"
          READY="$(curl -fsS http://127.0.0.1:18000/api/v1/ready)"

          echo "$HEALTH"
          echo "$READY"

          echo "$HEALTH" | grep -q '"status":"ok"'
          echo "$READY" | grep -q '"database":true'
          echo "$READY" | grep -q '"graph":true'
          echo "$READY" | grep -q '"kafka":true'

          echo "AgentABI AWS deployment verified successfully."
