name: Deploy AgentABI Demo to GKE

on:
  workflow_dispatch:

concurrency:
  group: agentabi-demo-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  REGISTRY: ${{ vars.GAR_REGISTRY }}
  NAMESPACE: agentabi
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/agentabi-api:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_AGENTABI_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/agentabi-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Create namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Sync Secret Manager values to Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          OPENAI_API_KEY="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-openai-api-key \
            --project="$PROJECT_ID")"

          JWT_SECRET="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-jwt-signing-key \
            --project="$PROJECT_ID")"

          POSTGRES_PASSWORD="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-postgres-password \
            --project="$PROJECT_ID")"

          NEO4J_PASSWORD="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-neo4j-password \
            --project="$PROJECT_ID")"

          GITHUB_OAUTH_CLIENT_ID="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-github-oauth-client-id \
            --project="$PROJECT_ID")"

          GITHUB_OAUTH_CLIENT_SECRET="$(gcloud secrets versions access latest \
            --secret=agentabi-demo-github-oauth-client-secret \
            --project="$PROJECT_ID")"

          kubectl -n "$NAMESPACE" create secret generic agentabi-secrets \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=POSTGRES_USER=agentabi \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=NEO4J_PASSWORD="$NEO4J_PASSWORD" \
            --from-literal=NEO4J_AUTH="neo4j/${NEO4J_PASSWORD}" \
            --from-literal=GITHUB_OAUTH_CLIENT_ID="$GITHUB_OAUTH_CLIENT_ID" \
            --from-literal=GITHUB_OAUTH_CLIENT_SECRET="$GITHUB_OAUTH_CLIENT_SECRET" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          unset OPENAI_API_KEY
          unset JWT_SECRET
          unset POSTGRES_PASSWORD
          unset NEO4J_PASSWORD
          unset GITHUB_OAUTH_CLIENT_ID
          unset GITHUB_OAUTH_CLIENT_SECRET

      - name: Helm lint
        run: |
          helm lint deploy/helm/agentabi \
            --values deploy/helm/agentabi/values-gcp.yaml \
            --set image.registry="$REGISTRY" \
            --set image.tag="$IMAGE_TAG" \
            --set ingress.enabled=false

      - name: Deploy
        run: |
          helm upgrade --install agentabi \
            deploy/helm/agentabi \
            --namespace "$NAMESPACE" \
            --values deploy/helm/agentabi/values-gcp.yaml \
            --set image.registry="$REGISTRY" \
            --set image.tag="$IMAGE_TAG" \
            --set ingress.enabled=false \
            --wait \
            --timeout 15m

  verify:
    name: Verify GKE Deployment
    runs-on: ubuntu-latest
    needs: deploy
    environment: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            "$GKE_CLUSTER" \
            --region "$REGION" \
            --project "$PROJECT_ID"

      - name: Verify Kubernetes workloads
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            deployment/agentabi-api \
            --timeout=300s

          kubectl -n "$NAMESPACE" rollout status \
            deployment/agentabi-worker \
            --timeout=300s

          kubectl -n "$NAMESPACE" rollout status \
            deployment/agentabi-frontend \
            --timeout=300s

          kubectl -n "$NAMESPACE" rollout status \
            deployment/agentabi-kafka \
            --timeout=300s

          kubectl -n "$NAMESPACE" rollout status \
            deployment/agentabi-redis \
            --timeout=300s

          kubectl -n "$NAMESPACE" rollout status \
            statefulset/agentabi-neo4j \
            --timeout=600s

      - name: Verify API readiness
        shell: bash
        run: |
          set -euo pipefail

          API_POD="$(kubectl -n "$NAMESPACE" get pod \
            -l app=agentabi-api \
            -o jsonpath='{.items[0].metadata.name}')"

          READY="$(kubectl -n "$NAMESPACE" exec "$API_POD" -- \
            curl -fsS http://localhost:8000/api/v1/ready)"

          echo "$READY"

          echo "$READY" | grep -q '"database":true'
          echo "$READY" | grep -q '"graph":true'
          echo "$READY" | grep -q '"kafka":true'

          echo "AgentABI deployment verified."
