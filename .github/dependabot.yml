version: 2
updates:
  # GitHub Actions used in ci.yml / deploy.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Deterministic core (compatibility/replay/differential/risk) has
      # no LLM-provider or web-framework dependency drift risk in
      # common; group routine patch/minor bumps together so they don't
      # each open a separate PR, but keep majors ungrouped so a breaking
      # bump (e.g. FastAPI/SQLAlchemy major) still gets its own review.
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
