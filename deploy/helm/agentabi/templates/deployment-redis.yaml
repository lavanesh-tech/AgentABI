apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentabi-redis
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentabi-redis
  template:
    metadata:
      labels:
        app: agentabi-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: agentabi-redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: agentabi-redis
  ports:
    - port: 6379
      targetPort: 6379
