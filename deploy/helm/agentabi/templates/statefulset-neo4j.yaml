apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentabi-neo4j
  namespace: {{ .Values.namespace }}
  labels:
    app: agentabi-neo4j
    {{- include "agentabi.labels" . | nindent 4 }}
spec:
  serviceName: agentabi-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: agentabi-neo4j
  template:
    metadata:
      labels:
        app: agentabi-neo4j
    spec:
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image | quote }}
          env:
            - name: NEO4J_PLUGINS
              value: {{ .Values.neo4j.plugins | quote }}
            # NEO4J_AUTH=neo4j/<password> — the password half comes from
            # agentabi-secrets (jwtSecret's neighboring Neo4j credential
            # is intentionally NOT reused; Neo4j gets its own Secrets
            # Manager container per infra/terraform/modules/secrets —
            # extend aws.secrets / secretproviderclass.yaml with a
            # neo4jPassword entry once Phase 19 provisions one) — until
            # then this falls back to the same local-dev-only default
            # docker-compose.yml uses, which is NOT suitable for a real
            # demo and must be overridden.
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: agentabi-secrets
                  key: NEO4J_AUTH
          ports:
            - containerPort: 7474
              name: browser
            - containerPort: 7687
              name: bolt
          startupProbe:
            httpGet:
              path: /
              port: browser
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /
              port: browser
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: browser
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.neo4j | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agentabi-neo4j
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None # headless — StatefulSet stable network identity
  selector:
    app: agentabi-neo4j
  ports:
    - name: browser
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
