apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentabi-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: agentabi-worker
    {{- include "agentabi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: agentabi-worker
  template:
    metadata:
      labels:
        app: agentabi-worker
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: worker
          image: {{ include "agentabi.image" (dict "registry" .Values.image.registry "repository" "agentabi-api" "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Same image as the API (docker-compose.yml's own convention —
          # see ADR history in docs/DECISIONS.md), different command:
          # the Kafka consumer, not uvicorn.
          command:
            - sh
            - -c
            - >-
              export POSTGRES_DSN="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${PGHOST}:5432/${PGDATABASE}" &&
              exec python -m app.kafka.worker
          envFrom:
            - configMapRef:
                name: agentabi-config
            - secretRef:
                name: agentabi-secrets
          ports:
            - containerPort: 9101
              name: metrics
          # The worker has no FastAPI HTTP surface — its own Prometheus
          # metrics server (started in app.kafka.worker.main(), see
          # docker-compose.yml's identical rationale) is the only HTTP
          # endpoint to probe.
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - name: csi-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: csi-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: agentabi-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: agentabi-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: agentabi-worker
spec:
  selector:
    app: agentabi-worker
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
