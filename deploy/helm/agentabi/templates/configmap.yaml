apiVersion: v1
kind: ConfigMap
metadata:
  name: agentabi-config
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  PGHOST: {{ .Values.gcp.postgresHost | quote }}
  PGDATABASE: "agentabi"

  REDIS_DSN: "redis://agentabi-redis:6379/0"

  NEO4J_URI: "bolt://agentabi-neo4j:7687"
  NEO4J_USER: "neo4j"

  KAFKA_BOOTSTRAP_SERVERS: "agentabi-kafka:9092"
  KAFKA_ENABLED: "true"

  OTEL_ENABLED: "false"
