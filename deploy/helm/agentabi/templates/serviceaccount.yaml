{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agentabi.labels" . | nindent 4 }}
  annotations:
    # Created as a pre-install/pre-upgrade hook, same as configmap.yaml
    # and secretproviderclass.yaml — see job-migrate.yaml's header
    # comment for why these three need to exist before Helm's normal
    # resource ordering would otherwise create them.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    # IRSA: binds this ServiceAccount to the `app_workload` IAM role
    # created by infra/terraform/modules/iam. Pods using this
    # ServiceAccount get scoped AWS credentials (ECR pull, Secrets
    # Manager read) via the EKS OIDC provider — never node-wide IAM
    # permissions, never static AWS keys in a Secret.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
