# Uses the AWS Secrets and Configuration Provider (ASCP) for the
# Kubernetes Secrets Store CSI Driver — the current AWS-recommended way
# to get Secrets Manager values into pods without an application-level
# AWS SDK call and without ever writing them into a Helm values file or
# Terraform state. The CSI driver + ASCP addon itself is a Phase 19
# cluster add-on install, not something Terraform or this chart installs;
# see infra/terraform/README.md's "Secrets strategy" section.
#
# secretObjects below additionally syncs the mounted values into a real
# Kubernetes Secret (`agentabi-secrets`) so they can be consumed as plain
# env vars by the deployments in this chart — the CSI volume mount alone
# only makes them available as files inside the pod.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentabi-secrets
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ .Values.aws.secrets.jwtSigningKey | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: value
            objectAlias: jwtSecret
      - objectName: {{ .Values.aws.secrets.openaiApiKey | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: value
            objectAlias: openaiApiKey
      - objectName: {{ .Values.aws.secrets.githubOauthClient | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: client_id
            objectAlias: githubOauthClientId
          - path: client_secret
            objectAlias: githubOauthClientSecret
      - objectName: {{ .Values.aws.secrets.githubAppCredentials | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: app_id
            objectAlias: githubAppId
          - path: private_key
            objectAlias: githubPrivateKey
          - path: webhook_secret
            objectAlias: githubWebhookSecret
      - objectName: {{ .Values.aws.secrets.rdsMasterUserSecret | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: postgresUser
          - path: password
            objectAlias: postgresPassword
  secretObjects:
    - secretName: agentabi-secrets
      type: Opaque
      data:
        - objectName: jwtSecret
          key: JWT_SECRET
        - objectName: openaiApiKey
          key: OPENAI_API_KEY
        - objectName: githubOauthClientId
          key: GITHUB_OAUTH_CLIENT_ID
        - objectName: githubOauthClientSecret
          key: GITHUB_OAUTH_CLIENT_SECRET
        - objectName: githubAppId
          key: GITHUB_APP_ID
        - objectName: githubPrivateKey
          key: GITHUB_PRIVATE_KEY
        - objectName: githubWebhookSecret
          key: GITHUB_WEBHOOK_SECRET
        - objectName: postgresUser
          key: POSTGRES_USER
        - objectName: postgresPassword
          key: POSTGRES_PASSWORD
