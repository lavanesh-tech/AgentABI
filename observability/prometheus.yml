# Phase 16 — minimal local Prometheus scrape config. No credentials, no
# remote_write, no cloud target. Scrapes the API's own `/metrics` (spec
# §6) and the Kafka worker's dedicated metrics port (spec §14 — the
# worker isn't a FastAPI process, so it gets its own tiny
# prometheus_client HTTP listener instead of sharing the API's route).
#
# Container-network hostnames (`api`, `worker`) resolve inside
# docker-compose's `agentabi` network — see docker-compose.yml. This
# file intentionally does not scrape Postgres/Redis/Neo4j/Kafka
# themselves (no exporters are set up for them — spec §18/§26: never
# fabricate a scrape target for a metric that isn't actually emitted).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agentabi-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: agentabi-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

  # Phase 15's OTel Collector optionally exposes its own internal
  # metrics (spans received/exported, queue depth) on :8888 when its
  # `telemetry` block is configured — left commented out since
  # otel-collector-config.yaml doesn't enable that exporter yet
  # (deliberately minimal, spec §27); uncomment if that's added later.
  # - job_name: otel-collector
  #   static_configs:
  #     - targets: ["otel-collector:8888"]
