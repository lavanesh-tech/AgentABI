[project]
name = "agentabi"
version = "0.1.0"
description = "AgentABI — Agent Compatibility & Upgrade Intelligence Platform"
requires-python = ">=3.12"
readme = "../README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "asyncpg>=0.29,<0.30",
    "psycopg[binary]>=3.2,<3.3",
    "httpx>=0.27,<0.28",
    "redis>=5.1,<6.0",
    "neo4j>=5.24,<6.0",
    "structlog>=24.4,<25.0",
    "python-json-logger>=2.0,<3.0",
    "orjson>=3.10,<4.0",
    "openai>=1.54,<2.0",
    "aiokafka>=0.11,<0.12",
    "opentelemetry-api>=1.27,<1.28",
    "opentelemetry-sdk>=1.27,<1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<1.28",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.48b0,<0.49",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<0.49",
    "prometheus-client>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true

# FastAPI's route-decorator factories (`@router.get(...)`, `@app.get(...)`,
# `@app.exception_handler(...)`) resolve to an untyped decorator in this
# environment — the same Starlette typing gap documented inline on
# app/core/middleware.py's, app/core/security_headers.py's, and
# app/core/metrics_middleware.py's `BaseHTTPMiddleware` subclasses, which
# is a real, third-party typing limitation with no cleaner typed
# boundary — even though every decorated handler in these modules has
# full parameter and return type annotations of its own. Scoped to only
# the two module groups that actually declare FastAPI routes; every
# other strict-mode check (no-untyped-def, no-any-return,
# disallow-any-generics, disallow_subclassing_any, etc.) still applies
# here exactly as everywhere else in this codebase — this disables only
# `disallow_untyped_decorators`, and only for these modules.
[[tool.mypy.overrides]]
module = ["app.api.v1.*", "app.main"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
